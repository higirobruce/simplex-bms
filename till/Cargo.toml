[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
rust_decimal = { version = "1.36", default-features = false, features = ["std", "serde-with-str"] }
argon2 = "0.6"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
eframe = "0.32"
# No OpenSSL: TLS is rustls, so a Windows till needs no system crypto library.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# The lane token lives in the OS credential store (Windows Credential Manager,
# macOS Keychain, Linux kernel keyring), never in a file beside the database.
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
