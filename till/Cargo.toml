[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
rust_decimal = { version = "1.36", default-features = false, features = ["std", "serde-with-str"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
