[package]
name = "till-lane"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
eframe.workspace = true
rust_decimal.workspace = true
thiserror.workspace = true
# The UI owns the runtime that drives the async store (see main.rs).
# `time` and `sync` are for the sync heartbeat and its wake-up signal.
tokio = { workspace = true, features = ["time", "sync"] }
reqwest.workspace = true
keyring.workspace = true
serde.workspace = true
serde_json.workspace = true
till-core = { path = "../till-core" }
till-store = { path = "../till-store" }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "net", "io-util", "time"] }
sqlx.workspace = true
argon2.workspace = true
